name: 교구 목록 10분 자동 갱신

on:
  # 주 동력: 각 실행이 끝날 때 다음 실행을 스스로 예약(아래 'next' 작업).
  # GitHub 예약 실행은 몇 시간씩 건너뛸 때가 있어, 아래 cron은 사슬이 끊겼을 때 다시 잇는 보조 장치입니다.
  schedule:
    - cron: '*/30 * * * *'
    - cron: '0 0 1 * *'      # 매월 1일: 60일 비활성 자동중지 방지용 keepalive
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 교구 목록 수집 (실패한 지원청은 직전 데이터 유지)
        run: |
          PREV="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data.json"
          node scripts/scrape.mjs "$PREV" || node scripts/scrape.mjs public/seed-data.json

      - name: Keepalive (매월 1일만)
        if: github.event.schedule == '0 0 1 * *'
        run: |
          date -u > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive && git commit -m "keepalive" && git push || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url }}
    steps:
      # GitHub Pages 서버가 가끔 500 오류를 내므로 한 번 더 시도
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.d1.outcome == 'failure'
        run: sleep 60
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # 다음 수집 예약: 낮(06~22시)에는 약 10분 뒤, 밤에는 약 1시간 뒤
  next:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: 기다렸다가 다음 실행 걸기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(TZ=Asia/Seoul date +%H)
          if [ "$H" -ge 6 ] && [ "$H" -lt 22 ]; then WAIT=420; else WAIT=3300; fi
          echo "KST ${H}시 → ${WAIT}초 뒤 다음 실행"
          sleep "$WAIT"
          # GitHub API가 가끔 500 오류를 내므로 최대 5번 시도
          for i in 1 2 3 4 5; do
            gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref main && exit 0
            echo "다음 실행 걸기 실패($i/5), 30초 뒤 다시 시도"; sleep 30
          done
          exit 1
